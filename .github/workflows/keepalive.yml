# Pings the family database twice a week so Supabase's free plan never pauses it for inactivity.
name: Keep database awake
on:
  schedule:
    - cron: '17 13 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://adsdvpbeewfoipjtndxn.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered $code"
          test "$code" = "200"
        env:
          # the public anon key, the same one the website already publishes
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkc2R2cGJlZXdmb2lwanRuZHhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NzY2MzIsImV4cCI6MjEwODI1MjYzMn0.VmlfSjV9UovBEaCFoeD9N04FGQZDU_N3llNjqFFMUQU
