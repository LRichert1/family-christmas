<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b3262e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Family Christmas Lists</title>
<style>
:root{--red:#b3262e;--green:#1f6b4a;--bg:#faf6f0;--card:#fff;--ink:#2a2420;--mute:#7a6f66;--line:#e8dfd3}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--red);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:1.15rem}
header .count{font-size:.8rem;opacity:.9}
header button{background:transparent;color:#fff;border:1px solid #fff8;border-radius:8px;padding:6px 10px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:1.1rem}
h3{margin:14px 0 4px;font-size:.95rem;color:var(--green)}
input,select,button.primary{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);width:100%;margin-bottom:8px;background:#fff;color:var(--ink)}
button.primary{background:var(--green);color:#fff;border:0;cursor:pointer}
button.small,a.small{font:inherit;font-size:.85rem;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}
button.small.on{background:var(--green);color:#fff;border-color:var(--green)}
a.small.buy{background:var(--red);color:#fff;border-color:var(--red)}
button.del{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font:inherit}
.tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.item{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.item:first-of-type{border-top:0}
.item .main{display:flex;gap:10px;align-items:flex-start;min-width:0}
.item img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
.item .btns{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.meta{color:var(--mute);font-size:.88rem;word-break:break-word}
.item.claimed .t{text-decoration:line-through;color:var(--mute)}
.pri{font-size:.75rem;font-weight:600;border-radius:10px;padding:1px 8px;background:#f3ece0;color:var(--mute);margin-left:6px;white-space:nowrap}
.pri.p1{background:#fbe4e4;color:var(--red)}
.tag{font-size:.8rem;color:var(--green);font-weight:600}
.err{color:var(--red);min-height:1.2em;font-size:.9rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkrow{display:flex;gap:8px;align-items:flex-start}
.linkrow input{margin-bottom:8px}
.linkrow button{white-space:nowrap;margin-top:2px}
label.file{font-size:.85rem;color:var(--mute);display:block;margin-bottom:8px}
label.file input{padding:6px}
.empty{color:var(--mute);font-style:italic}
.total{font-weight:700;font-size:1.05rem;display:flex;justify-content:space-between;margin-top:10px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.controls select{width:auto;margin:0;padding:6px 8px;font-size:.88rem}
.chk{font-size:.9rem;display:flex;align-items:center;gap:6px}
.chk input{width:auto;margin:0}
.item.done{opacity:.55}
details summary{cursor:pointer;margin-bottom:8px}
.about div{margin:2px 0;font-size:.95rem}
.famname{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:4px 0 6px}
.over{color:var(--red)}
.under{color:var(--green)}
</style>
</head>
<body>
<header><div><h1>🎄 Family Christmas Lists</h1><div class="count" id="count"></div></div><button id="out" hidden>Sign out</button></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const db = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
let state = null, view = 'mine', editing = null, prefill = null;
let sortBy = 'pri', filterPri = 0, hideTaken = false;
const INFO = [['shirt_size', '👕 Shirt', 'e.g. Large'], ['pants_size', '👖 Pants', 'e.g. Large'], ['jeans_size', '👖 Jeans', 'e.g. 32x34'],
  ['shoe_size', '👟 Shoe', 'e.g. 10.5'], ['jewelry_color', '💍 Jewelry color', 'e.g. Gold, silver, rose gold'], ['interests', '⭐ Interests', 'Sports teams, shows, characters…']];

// Pull a product link (and a name, if there is one) out of whatever Amazon or a browser shared.
function parseShared(text) {
  const m = /https?:\/\/[^\s<>"']+/i.exec(text || '');
  if (!m) return null;
  const link = m[0].replace(/[.,;)]+$/, '');
  let name = text.replace(m[0], ' ').replace(/^\s*(check out|take a look at|look at|see)\b[^:]{0,40}:/i, '')
    .replace(/^\s*(check\s+(this|it|that)\s+out|check\s+out|take a look at|look at)\s*(this\s+|the\s+)?[:,!.-]*\s*/i, '')
    .replace(/\b(at|on) amazon(\.com)?\b\.?/ig, '').replace(/\s+/g, ' ').replace(/^[\s:–—-]+|[\s:–—-]+$/g, '');
  if (!name) {
    const s = /amazon\.[a-z.]+\/([^/?#]+)\/(?:dp|gp\/product)\//i.exec(link);
    if (s) name = decodeURIComponent(s[1]).replace(/-/g, ' ');
  }
  return { link, name: name.slice(0, 120) };
}
(() => {
  const q = new URLSearchParams(location.search);
  const p = parseShared([q.get('title'), q.get('text'), q.get('url')].filter(Boolean).join(' '));
  if (p) { prefill = p; history.replaceState(null, '', location.pathname); }
})();

const PRI = { 1: '⭐ Must-have', 2: '🙂 Would like', 3: '💭 Maybe' };
const emailFor = (name) => name.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '') + '@family.local';
const money = (n) => '$' + n.toFixed(2);
const num = (s) => parseFloat(String(s || '').replace(/[^0-9.]/g, '')) || 0;
const imgUrl = (p) => db.storage.from('item-images').getPublicUrl(p).data.publicUrl;
const fixLink = (l) => (/^https?:\/\//.test(l) ? l : 'https://' + l);

function countdown() {
  const now = new Date(), y = now.getFullYear();
  let xmas = new Date(y, 11, 25);
  if (now > new Date(y, 11, 26)) xmas = new Date(y + 1, 11, 25);
  const days = Math.ceil((xmas - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  $('#count').textContent = days === 0 ? '🎅 Merry Christmas!' : `${days} day${days === 1 ? '' : 's'} until Christmas`;
}

async function resizeToJpeg(file) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
}

async function uploadPhoto(file) {
  const blob = await resizeToJpeg(file);
  const path = `${state.me}/${crypto.randomUUID()}.jpg`;
  const { error } = await db.storage.from('item-images').upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw error;
  return path;
}

async function load() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return renderLogin();
  const me = session.user.id;
  const [p, i, c, b, f, m] = await Promise.all([
    db.from('profiles').select('*').order('display_name'),
    db.from('items').select('*').order('priority').order('created_at'),
    db.from('claims').select('*'),
    db.from('budgets').select('*').maybeSingle(),
    db.from('families').select('id,name').order('name'),
    db.from('memberships').select('*'),
  ]);
  const err = p.error || i.error || c.error || b.error || f.error || m.error;
  if (err) return alert(err.message);
  if (!p.data.some((u) => u.id === me)) { await db.auth.signOut(); return renderLogin('Please sign in again.'); }
  const names = Object.fromEntries(p.data.map((x) => [x.id, x.display_name]));
  const claimsBy = {};
  c.data.forEach((x) => (claimsBy[x.item_id] = claimsBy[x.item_id] || []).push(x));
  const famsOf = {};
  m.data.forEach((x) => (famsOf[x.user_id] = famsOf[x.user_id] || []).push(x.family_id));
  state = {
    me,
    budget: b.data ? Number(b.data.amount) : null,
    families: f.data,
    people: p.data.map((u) => ({
      id: u.id, name: u.display_name, info: u, famIds: famsOf[u.id] || [],
      items: i.data.filter((x) => x.owner === u.id).map((x) => {
        const cl = claimsBy[x.id] || [];
        return {
          ...x,
          claimers: cl.map((k) => ({ name: names[k.claimed_by] || 'Someone', mine: k.claimed_by === me })),
          myClaim: cl.find((k) => k.claimed_by === me) || null,
          isGroup: cl.length > 0 && cl.every((k) => k.is_group),
          groupFamily: (cl.find((k) => k.is_group) || {}).group_family || null,
        };
      }),
    })),
  };
  renderApp();
}

function renderLogin(msg = '') {
  $('#out').hidden = true;
  $('#app').innerHTML = `<div class="card"><h2>Sign in</h2>
    <p class="meta">Use your username and PIN. First time? Fill in the family code and press Create account.</p>
    <input id="u" placeholder="Username (e.g. Grandma)" autocomplete="username">
    <input id="p" type="password" placeholder="PIN (6+ characters)" autocomplete="current-password">
    <input id="f" placeholder="Family code (new accounts only)">
    <div class="err" id="e">${esc(msg)}</div>
    <button class="primary" id="go">Sign in</button>
    <button class="primary" id="new" style="background:var(--red)">Create account</button></div>`;
  const run = async (create) => {
    const name = $('#u').value.trim(), pin = $('#p').value;
    if (!emailFor(name).replace('@family.local', '')) return ($('#e').textContent = 'Enter a username (letters and numbers).');
    if (pin.length < 6) return ($('#e').textContent = 'PIN must be at least 6 characters.');
    const email = emailFor(name);
    const r = create
      ? await db.auth.signUp({ email, password: pin, options: { data: { display_name: name, family_code: $('#f').value.trim() } } })
      : await db.auth.signInWithPassword({ email, password: pin });
    if (r.error) {
      const m = r.error.message;
      return ($('#e').textContent = /database error/i.test(m) ? 'Wrong family code, or that username is taken.'
        : /invalid login/i.test(m) ? 'Wrong username or PIN.' : /already/i.test(m) ? 'That username is taken.' : m);
    }
    view = 'mine'; load();
  };
  $('#go').onclick = () => run(false);
  $('#new').onclick = () => run(true);
  $('#app').onkeydown = (e) => { if (e.key === 'Enter') run(false); };
}

function renderApp() {
  $('#out').hidden = false;
  const others = state.people.filter((p) => p.id !== state.me);
  if (view !== 'mine' && view !== 'shop' && !others.find((p) => p.id === view)) view = 'mine';
  const tab = (v, label) => `<button class="${view === v ? 'active' : ''}" data-v="${esc(v)}">${label}</button>`;
  const mineRow = `<div class="tabs">${tab('mine', 'My list')}${tab('shop', '🛍 Shopping')}</div>`;
  const people = state.families.length > 1
    ? state.families.map((f) => `<div class="famname">${esc(f.name)}</div><div class="tabs">${others.filter((p) => p.famIds.includes(f.id)).map((p) => tab(p.id, esc(p.name))).join('') || '<span class="meta">No one else here yet</span>'}</div>`).join('')
    : `<div class="tabs">${others.map((p) => tab(p.id, esc(p.name))).join('')}</div>`;
  const tabs = mineRow + people;
  $('#app').innerHTML = tabs + (view === 'mine' ? mine() : view === 'shop' ? shopping() : theirs(others.find((p) => p.id === view)));
  document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => { view = b.dataset.v; editing = null; renderApp(); });
  wire();
}

function meta(i) {
  return [i.price && '$' + esc(i.price.replace(/^\$/, '')), i.notes && esc(i.notes)].filter(Boolean).join(' · ');
}
function thumb(i) { return i.image_path ? `<a href="${esc(imgUrl(i.image_path))}" target="_blank" rel="noopener"><img src="${esc(imgUrl(i.image_path))}" alt="" loading="lazy"></a>` : ''; }
function pri(i) { return `<span class="pri p${i.priority}">${PRI[i.priority]}</span>`; }
function buy(i) { return i.link ? `<a class="small buy" href="${esc(fixLink(i.link))}" target="_blank" rel="noopener">Buy ↗</a>` : ''; }

function mine() {
  const me = state.people.find((p) => p.id === state.me);
  const form = (i = {}) => `<input id="n" placeholder="What do you want?" value="${esc(i.name)}">
    <select id="pri">${[1, 2, 3].map((k) => `<option value="${k}" ${(i.priority || 2) === k ? 'selected' : ''}>${PRI[k]}</option>`).join('')}</select>
    <div class="linkrow"><input id="l" placeholder="Product link (optional)" value="${esc(i.link)}"><button class="small" type="button" id="pst">📋 Paste</button><button class="small" type="button" id="amz">Search Amazon</button></div>
    ${i.id ? '' : '<div class="meta" style="margin:-2px 0 8px">Found it in Amazon? Tap Share → Copy, come back here and tap Paste. It fills in the name and link.</div>'}
    <div class="row"><input id="pr" placeholder="Price (optional)" value="${esc(i.price)}"><input id="no" placeholder="Size, color… (optional)" value="${esc(i.notes)}"></div>
    <label class="file">📷 Photo ${i.image_path ? '(choose a new one to replace)' : '(optional)'}<input id="ph" type="file" accept="image/*"></label>`;
  const items = tidy(me.items, false).map((i) => editing === i.id
    ? `<div class="item"><div style="width:100%">${form(i)}<button class="primary" data-save="${i.id}">Save</button> <button class="small" data-cancel>Cancel</button></div></div>`
    : `<div class="item"><div class="main">${thumb(i)}<div><div class="t">${esc(i.name)}${pri(i)}</div><div class="meta">${meta(i)}</div></div></div>
       <div class="btns">${buy(i)}<span><button class="small" data-edit="${i.id}">Edit</button> <button class="small del" data-del="${i.id}">✕</button></span></div></div>`).join('');
  const start = prefill ? { name: prefill.name, link: prefill.link } : {};
  prefill = null;
  return `${editing ? '' : `<div class="card"><h2>Add to my list</h2>${prefill === null && start.link ? '<div class="tag" style="margin-bottom:8px">✅ Product added from your share. Check it and press Add item.</div>' : ''}${form(start)}<button class="primary" id="add">Add item</button></div>`}
    ${editing ? '' : aboutForm(me)}
    <div class="card"><h2>My list</h2>${me.items.length ? controls(false) : ''}${items || `<div class="empty">${me.items.length ? 'No items match this filter.' : 'Nothing yet — add something above!'}</div>`}
    <p class="meta">🤫 You can't see what others plan to buy for you.</p>
    ${me.items.length ? '<button class="small del" id="clearall">Clear my whole list (new year)</button>' : ''}</div>
    <div class="card"><h2>My families</h2>
    <div class="meta" style="margin-bottom:8px">${state.families.map((f) => esc(f.name)).join(' · ') || 'None yet'}</div>
    <div class="linkrow"><input id="famcode" placeholder="Code for another family"><button class="small" id="joinfam">Join</button></div>
    <div class="meta">Join a second family to see everyone on both sides. They'll be able to see your list too.</div></div>`;
}

// Sort and filter a list of items.
function tidy(items, others) {
  const key = (i) => num(i.price) || null;
  const byDate = (a, b) => String(a.created_at).localeCompare(String(b.created_at));
  const nullsLast = (f) => (a, b) => (key(a) === null) - (key(b) === null) || f(key(a), key(b));
  const cmp = {
    pri: (a, b) => a.priority - b.priority || byDate(a, b),
    low: nullsLast((x, y) => (x || 0) - (y || 0)),
    high: nullsLast((x, y) => (y || 0) - (x || 0)),
    new: (a, b) => byDate(b, a),
  }[sortBy];
  return items.filter((i) => (!filterPri || i.priority === filterPri) && !(others && hideTaken && i.claimers.length)).sort(cmp);
}

function controls(others) {
  const opt = (v, label, cur) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${label}</option>`;
  return `<div class="controls">
    <select id="sort">${opt('pri', 'Sort: priority', sortBy)}${opt('low', 'Sort: price low → high', sortBy)}${opt('high', 'Sort: price high → low', sortBy)}${opt('new', 'Sort: newest first', sortBy)}</select>
    <select id="fpri">${opt(0, 'Show: all', filterPri)}${opt(1, PRI[1], filterPri)}${opt(2, PRI[2], filterPri)}${opt(3, PRI[3], filterPri)}</select>
    ${others ? `<label class="chk"><input type="checkbox" id="hidetaken" ${hideTaken ? 'checked' : ''}> Hide taken</label>` : ''}</div>`;
}

function aboutForm(me) {
  const filled = INFO.some(([k]) => me.info[k]);
  return `<details class="card" ${filled ? '' : 'open'}><summary><b>👤 My sizes &amp; interests</b></summary>
    <p class="meta">Everyone in the family can see this, to make shopping for you easier.</p>
    ${INFO.map(([k, label, ph]) => `<label class="meta">${label}</label><input id="info_${k}" placeholder="${ph}" value="${esc(me.info[k] || '')}">`).join('')}
    <button class="primary" id="saveinfo">Save</button></details>`;
}

// The claim status line and buttons for one item on someone else's list.
function claimUI(i, owner) {
  const n = i.claimers.length, mine = !!i.myClaim, who = i.claimers.slice().sort((a, b) => b.mine - a.mine).map((c) => (c.mine ? 'You' : esc(c.name)));
  const each = num(i.price) && n > 1 ? ` · about ${money(num(i.price) / n)} each` : '';
  // a group gift is open to one family: any family I belong to that the list's owner also belongs to
  const groupFams = state.families.filter((f) => owner.famIds.includes(f.id));
  const groupBtns = (attr) => groupFams.map((f) => `<button class="small" data-${attr}="${i.id}" data-fam="${f.id}">👥 ${groupFams.length > 1 ? `Group gift: ${esc(f.name)}` : 'Group gift'}</button>`).join('');
  if (!n) return { tag: '', btns: `<button class="small" data-claim="${i.id}">I'll buy this</button>${groupBtns('claim')}` };
  if (i.isGroup) {
    const fam = state.families.find((f) => f.id === i.groupFamily);
    const famNote = fam ? ` for ${esc(fam.name)}` : '';
    const canJoin = !!fam;
    const tag = !canJoin ? `👥 Group gift for another family (closed to you)`
      : n === 1 ? `👥 ${who[0]} started a group gift${famNote}. Others in that family can chip in` : `👥 ${who.join(', ')} are chipping in${each}`;
    const btns = mine
      ? `<button class="small on" data-unclaim="${i.id}">Leave</button>${n === 1 ? `<button class="small" data-solo="${i.id}">Buy solo</button>` : ''}`
      : canJoin ? `<button class="small" data-claim="${i.id}" data-fam="${i.groupFamily}" data-join="1">Chip in</button>` : '';
    return { tag, btns };
  }
  return mine
    ? { tag: "You're buying this", btns: `<button class="small on" data-unclaim="${i.id}">Unclaim</button>${groupBtns('open').replace(/Group gift/g, 'Open to group')}` }
    : { tag: `${who[0]} is buying this`, btns: '' };
}

function theirs(p) {
  const items = tidy(p.items, true).map((i) => {
    const ui = claimUI(i, p);
    return `<div class="item ${i.claimers.length && !i.isGroup ? 'claimed' : ''}"><div class="main">${thumb(i)}<div><div class="t">${esc(i.name)}${pri(i)}</div><div class="meta">${meta(i)}</div>
      ${ui.tag ? `<div class="tag">${ui.tag}</div>` : ''}</div></div>
      <div class="btns">${buy(i)}${ui.btns}</div></div>`;
  }).join('');
  const about = INFO.filter(([k]) => p.info[k]).map(([k, label]) => `<div><b>${label}:</b> ${esc(p.info[k])}</div>`).join('');
  return `${about ? `<div class="card about"><h2>About ${esc(p.name)}</h2>${about}</div>` : ''}
    <div class="card"><h2>${esc(p.name)}'s list</h2>${p.items.length ? controls(true) : ''}${items || `<div class="empty">${p.items.length ? 'No items match this filter.' : `${esc(p.name)} hasn't added anything yet.`}</div>`}</div>`;
}

function shopping() {
  const groups = state.people.filter((p) => p.id !== state.me)
    .map((p) => ({ p, items: p.items.filter((i) => i.myClaim) })).filter((g) => g.items.length);
  const share = (i) => num(i.price) / i.claimers.length;
  const all = groups.flatMap((g) => g.items);
  const total = all.reduce((t, i) => t + share(i), 0);
  const boughtTotal = all.filter((i) => i.myClaim.bought).reduce((t, i) => t + share(i), 0);
  const left = state.budget == null ? null : state.budget - total;
  const body = groups.map((g) => `<h3>For ${esc(g.p.name)}</h3>` + g.items.map((i) => {
    const n = i.claimers.length;
    const price = num(i.price) ? (n > 1 ? `Your share ${money(share(i))} (split ${n} ways)` : money(num(i.price))) : 'no price listed';
    return `<div class="item ${i.myClaim.bought ? 'done' : ''}"><div class="main">${thumb(i)}<div><div class="t">${esc(i.name)}${n > 1 ? ' 👥' : ''}</div><div class="meta">${price}</div>
      <label class="chk"><input type="checkbox" data-bought="${i.id}" ${i.myClaim.bought ? 'checked' : ''}> Got it</label></div></div><div class="btns">${buy(i)}</div></div>`;
  }).join('')).join('');
  return `<div class="card"><h2>My shopping</h2>
    ${body || '<div class="empty">Nothing yet. Press “I\'ll buy this” on someone\'s list.</div>'}
    <div class="total"><span>Planned total</span><span>${money(total)}</span></div>
    <div class="total"><span>Already bought</span><span>${money(boughtTotal)}</span></div>
    <div class="total"><span>Still to buy</span><span>${money(total - boughtTotal)}</span></div>
    <div class="meta">Only items with a price are counted, and group gifts count only your share. Only you can see this tab.</div></div>
    <div class="card"><h2>My budget</h2>
    <input id="bud" type="number" min="0" step="1" placeholder="Total I want to spend" value="${state.budget ?? ''}">
    <button class="primary" id="savebud">Save budget</button>
    ${left == null ? '' : `<div class="total"><span>${left >= 0 ? 'Left to spend' : 'Over budget by'}</span><span class="${left >= 0 ? 'under' : 'over'}">${money(Math.abs(left))}</span></div>`}</div>`;
}

function wire() {
  const act = async (fn) => {
    try { const r = await fn(); if (r && r.error) throw r.error; }
    catch (e) { alert(/duplicate|row-level security/.test(e.message) ? 'That item was just taken by someone else. Refreshing.' : e.message); }
    await load();
  };
  const fields = () => ({ name: $('#n').value.trim(), price: $('#pr').value.trim(), link: $('#l').value.trim(), notes: $('#no').value.trim(), priority: +$('#pri').value });
  const photo = () => ($('#ph') && $('#ph').files[0]) || null;
  const a = $('#add');
  if (a) a.onclick = () => { const f = fields(); if (!f.name) return alert('Enter an item name.'); a.disabled = true;
    act(async () => { const file = photo(); if (file) f.image_path = await uploadPhoto(file); return db.from('items').insert({ ...f, owner: state.me }); }); };
  const fillFrom = (text) => {
    const p = parseShared(text);
    if (!p) return false;
    $('#l').value = p.link;
    if (!$('#n').value.trim() && p.name) $('#n').value = p.name;
    return true;
  };
  const lf = $('#l');
  if (lf) lf.addEventListener('paste', (e) => {
    const t = (e.clipboardData || window.clipboardData).getData('text');
    if (fillFrom(t)) e.preventDefault();
  });
  const pst = $('#pst');
  if (pst) pst.onclick = async () => {
    try { if (!fillFrom(await navigator.clipboard.readText())) alert('No link found on your clipboard. Copy the product link first.'); }
    catch { alert('Could not read your clipboard. Long-press the link box and choose Paste instead.'); }
  };
  const amz = $('#amz');
  if (amz) amz.onclick = () => { const q = $('#n').value.trim(); if (!q) return alert('Type what you want first, then search.'); window.open('https://www.amazon.com/s?k=' + encodeURIComponent(q), '_blank', 'noopener'); };
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => confirm('Remove this item?') && act(async () => {
    const it = state.people.find((p) => p.id === state.me).items.find((x) => x.id === b.dataset.del);
    const r = await db.from('items').delete().eq('id', b.dataset.del);
    if (!r.error && it.image_path) await db.storage.from('item-images').remove([it.image_path]);
    return r;
  }));
  document.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => { editing = b.dataset.edit; renderApp(); });
  document.querySelectorAll('[data-cancel]').forEach((b) => b.onclick = () => { editing = null; renderApp(); });
  document.querySelectorAll('[data-save]').forEach((b) => b.onclick = () => { const f = fields(); if (!f.name) return alert('Enter an item name.'); b.disabled = true;
    act(async () => {
      const it = state.people.find((p) => p.id === state.me).items.find((x) => x.id === b.dataset.save);
      const file = photo();
      if (file) { f.image_path = await uploadPhoto(file); if (it.image_path) await db.storage.from('item-images').remove([it.image_path]); }
      editing = null;
      return db.from('items').update(f).eq('id', b.dataset.save);
    }); });
  document.querySelectorAll('[data-claim]').forEach((b) => b.onclick = () =>
    act(() => db.from('claims').insert({ item_id: b.dataset.claim, claimed_by: state.me, is_group: !!b.dataset.fam, group_family: b.dataset.fam || null })));
  document.querySelectorAll('[data-unclaim]').forEach((b) => b.onclick = () =>
    act(() => db.from('claims').delete().eq('item_id', b.dataset.unclaim).eq('claimed_by', state.me)));
  const setGroup = (attr, group) => document.querySelectorAll(`[data-${attr}]`).forEach((b) => b.onclick = () =>
    act(() => db.from('claims').update({ is_group: group, group_family: group ? b.dataset.fam : null }).eq('item_id', b.dataset[attr]).eq('claimed_by', state.me)));
  setGroup('open', true);
  setGroup('solo', false);
  document.querySelectorAll('[data-bought]').forEach((b) => b.onchange = () =>
    act(() => db.from('claims').update({ bought: b.checked }).eq('item_id', b.dataset.bought).eq('claimed_by', state.me)));
  const rerender = () => renderApp();
  if ($('#sort')) $('#sort').onchange = (e) => { sortBy = e.target.value; rerender(); };
  if ($('#fpri')) $('#fpri').onchange = (e) => { filterPri = +e.target.value; rerender(); };
  if ($('#hidetaken')) $('#hidetaken').onchange = (e) => { hideTaken = e.target.checked; rerender(); };
  const jf = $('#joinfam');
  if (jf) jf.onclick = () => {
    const code = $('#famcode').value.trim();
    if (!code) return alert('Enter the family code first.');
    act(async () => {
      const r = await db.rpc('join_family', { p_code: code });
      if (!r.error) alert(`Joined ${r.data}!`);
      return r;
    });
  };
  const si = $('#saveinfo');
  if (si) si.onclick = () => act(async () => {
    const f = {};
    INFO.forEach(([k]) => { f[k] = $('#info_' + k).value.trim(); });
    const r = await db.from('profiles').update(f).eq('id', state.me);
    if (!r.error) alert('Saved!');
    return r;
  });
  const ca = $('#clearall');
  if (ca) ca.onclick = () => {
    const mineItems = state.people.find((p) => p.id === state.me).items;
    if (!confirm(`Remove all ${mineItems.length} items from your list? This can't be undone, and anyone who marked an item as bought loses that note.`)) return;
    act(async () => {
      const r = await db.from('items').delete().eq('owner', state.me);
      const paths = mineItems.map((i) => i.image_path).filter(Boolean);
      if (!r.error && paths.length) await db.storage.from('item-images').remove(paths);
      return r;
    });
  };
  const sb = $('#savebud');
  if (sb) sb.onclick = () => { const v = $('#bud').value; act(() => v === ''
    ? db.from('budgets').delete().eq('owner', state.me)
    : db.from('budgets').upsert({ owner: state.me, amount: Math.max(0, +v) })); };
}

$('#out').onclick = async () => { await db.auth.signOut(); state = null; renderLogin(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && state && !editing) load(); });
countdown();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
load();
</script>
</body>
</html>
